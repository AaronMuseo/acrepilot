services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: acrepilot
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: acrepilot
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acrepilot']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
